<h2 mat-dialog-title>Forgot password?</h2>
<mat-dialog-content>
  @if (sent()) {
    <p class="fp-note">
      If that email has an account, we've sent it a link to set a new password. The link works once
      and expires after a few hours.
    </p>
  } @else {
    <p class="fp-note">
      Enter the email on your account. We'll send a one-time link to set a new password.
    </p>
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Email</mat-label>
      <mat-icon matPrefix>mail</mat-icon>
      <input
        matInput
        type="email"
        name="email"
        [(ngModel)]="email"
        autocomplete="email"
        maxlength="256"
        (keyup.enter)="submit()"
      />
    </mat-form-field>
  }
</mat-dialog-content>
<mat-dialog-actions align="end">
  @if (sent()) {
    <button mat-flat-button color="primary" mat-dialog-close>Close</button>
  } @else {
    <button mat-button mat-dialog-close>Cancel</button>
    <button
      mat-flat-button
      color="primary"
      (click)="submit()"
      [disabled]="sending() || !email.trim()"
    >
      {{ sending() ? 'Sending…' : 'Send link' }}
    </button>
  }
</mat-dialog-actions>
